name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build release binaries
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE} -X main.builtBy=github-actions"

          mkdir -p dist
          targets="linux/amd64 linux/arm64 windows/amd64"
          for t in $targets; do
            # CGO_ENABLED=0 is what makes these binaries fully static: with cgo
            # the net package links the host resolver and the result depends on
            # the builder's libc. Verified below rather than assumed.
            export GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0
            out="bin"; [ "$GOOS" = "windows" ] && out="bin.exe"
            echo "building $GOOS/$GOARCH"
            go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./src

            if [ "$GOOS" = "linux" ]; then
              if readelf -d "$out" | grep -q NEEDED; then
                echo "::error::$GOOS/$GOARCH is dynamically linked:"
                readelf -d "$out" | grep NEEDED
                exit 1
              fi
              if readelf -l "$out" | grep -q INTERP; then
                echo "::error::$GOOS/$GOARCH requests a dynamic loader"
                exit 1
              fi
              echo "  verified static: no NEEDED entries, no INTERP segment"
            fi

            pkg="bin_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              zip -q "dist/${pkg}.zip" "$out"
            else
              tar -czf "dist/${pkg}.tar.gz" "$out"
            fi
            rm -f "$out"
          done
          ( cd dist && sha256sum * > SHA256SUMS )
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
